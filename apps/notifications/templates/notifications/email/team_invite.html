<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SURVERA</title></head>
<body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #0f172a;">
  <p>Hi {{ user.username|default:user.email }},</p>
  {% if reactivated %}
  <p>Your membership on <strong>{{ company.name }}</strong> was reactivated as <strong>{{ role_label }}</strong>.</p>
  {% else %}
  <p>You were added to <strong>{{ company.name }}</strong> as <strong>{{ role_label }}</strong>.</p>
  {% endif %}
  {% if body %}<p>{{ body }}</p>{% endif %}
  <p>
    <a href="{{ action_url }}" style="display:inline-block;padding:0.6rem 1rem;background:#2563eb;color:#fff;text-decoration:none;border-radius:0.5rem;">
      View team
    </a>
  </p>
  <p style="color:#64748b;font-size:0.85rem;">— {{ site_name }}</p>
</body>
</html>
